[package]
name = "kin"
version = "0.1.0"
description = "Kin private family messenger"
authors = ["c0di-org"]
edition = "2021"

[lib]
name = "kin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
