name: Bootstrap Kin source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".upload/**"
      - ".github/workflows/bootstrap-source.yml"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk-* | base64 --decode > /tmp/kin.zip
          rm -rf /tmp/kin-src
          mkdir -p /tmp/kin-src
          unzip -q /tmp/kin.zip -d /tmp/kin-src
          cp -a /tmp/kin-src/. .
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .dev.vars.example .github/workflows/deploy-cloudflare.yml .gitignore .nvmrc README.md SECURITY.md assets index.html package.json public src-tauri src tsconfig.json vite.config.ts worker wrangler.jsonc
          git add -u -- .upload
          git commit -m "Build Kin family messenger PWA and encrypted relay"
          git push origin HEAD:main
# trigger bootstrap
